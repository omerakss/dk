<!DOCTYPE html>
<html lang="tr" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ömer Ali Akkuş | Dijital Kartvizit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        .modal { transition: opacity 0.25s ease; }
        body.modal-active { overflow-x: hidden; overflow-y: hidden !important; }
        .lang-active { font-weight: 700; text-decoration: underline; }
    </style>
</head>
<body class="bg-gray-100 dark:bg-zinc-950 flex flex-col items-center justify-center min-h-screen p-4 transition-colors duration-300">

    <!-- Top Bar: Language & Theme -->
    <div class="mb-6 flex items-center justify-between w-full max-w-md">
        <div class="text-sm space-x-2 dark:text-zinc-400">
            <button id="lang-tr" class="lang-active hover:text-blue-600 transition-colors">TR</button>
            <span class="text-gray-400">|</span>
            <button id="lang-en" class="hover:text-blue-600 transition-colors">EN</button>
        </div>

        <button id="theme-toggle" class="p-2 rounded-full bg-white dark:bg-zinc-900 shadow-md hover:shadow-lg transition-all">
            <i id="theme-icon" class="fas fa-moon text-gray-700 dark:text-zinc-300"></i>
        </button>
    </div>

    <div class="max-w-md w-full bg-white dark:bg-zinc-900 rounded-3xl shadow-xl overflow-hidden transition-colors duration-300">
        <div class="h-32 bg-gradient-to-br from-indigo-900 to-black dark:from-indigo-950 dark:to-zinc-950"></div>

        <div class="px-6 pb-8">
            <div class="flex flex-col">
                <div class="w-28 h-28 bg-white dark:bg-zinc-900 rounded-2xl shadow-lg flex items-center justify-center border-4 border-white dark:border-zinc-800 overflow-hidden -mt-14 transition-colors duration-300">
                    <img src="https://ui-avatars.com/api/?name=Omer+Ali+Akkus&background=0D1117&color=fff&size=128" alt="Ömer Ali Akkuş" class="w-full h-full object-cover">
                </div>

                <div class="mt-4">
                    <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Ömer Ali Akkuş</h1>
                    <p id="txt-occupation" class="text-gray-600 dark:text-zinc-400 font-medium"></p>
                </div>
            </div>

            <div class="mt-6">
                <div class="flex flex-wrap gap-2">
                    <span class="px-3 py-1 bg-gray-100 dark:bg-zinc-800 text-gray-700 dark:text-zinc-300 text-xs font-semibold rounded-full transition-colors">Arduino • ESP8266</span>
                    <span class="px-3 py-1 bg-gray-100 dark:bg-zinc-800 text-gray-700 dark:text-zinc-300 text-xs font-semibold rounded-full transition-colors">Android • Kivy</span>
                    <span class="px-3 py-1 bg-gray-100 dark:bg-zinc-800 text-gray-700 dark:text-zinc-300 text-xs font-semibold rounded-full transition-colors">HTML/CSS</span>
                    <span class="px-3 py-1 bg-gray-100 dark:bg-zinc-800 text-gray-700 dark:text-zinc-300 text-xs font-semibold rounded-full transition-colors">FPV Drone</span>
                </div>
            </div>

            <div class="mt-8 grid grid-cols-1 gap-3">
                <a href="mailto:admin@omeraks.com" class="flex items-center justify-center py-3 bg-gray-900 dark:bg-white text-white dark:text-black rounded-xl font-semibold hover:opacity-90 transition-all">
                    <i class="fas fa-envelope mr-2"></i> <span id="txt-email"></span>
                </a>
                <a href="https://omeraks.com" target="_blank" class="flex items-center justify-center py-3 border-2 border-gray-900 dark:border-zinc-700 text-gray-900 dark:text-zinc-200 rounded-xl font-semibold hover:bg-gray-50 dark:hover:bg-zinc-800 transition-colors">
                    <i class="fas fa-globe mr-2"></i> <span id="txt-website"></span>
                </a>
                <button id="open-modal" class="flex items-center justify-center py-3 bg-blue-600 text-white rounded-xl font-semibold hover:bg-blue-700 transition-colors">
                    <i class="fas fa-info-circle mr-2"></i> <span id="txt-detailed-info"></span>
                </button>
            </div>

            <div class="mt-8 pt-6 border-t border-gray-100 dark:border-zinc-800">
                <h3 id="txt-about-title" class="text-sm font-bold text-gray-400 dark:text-zinc-500 uppercase tracking-wider mb-2"></h3>
                <p id="txt-about-text" class="text-gray-700 dark:text-zinc-300 text-sm leading-relaxed"></p>
            </div>

            <div class="mt-8 pt-6 border-t border-gray-100 dark:border-zinc-800">
                <h3 id="txt-contact-title" class="text-sm font-bold text-gray-400 dark:text-zinc-500 uppercase tracking-wider mb-4"></h3>
                <div class="flex flex-col space-y-4">
                    <a href="https://linkedin.com" target="_blank" class="flex items-center text-gray-600 dark:text-zinc-400 hover:text-blue-600 transition-colors">
                        <i class="fab fa-linkedin text-xl w-8"></i>
                        <span class="text-sm font-medium">LinkedIn</span>
                    </a>
                    <a href="https://instagram.com/akssomer" target="_blank" class="flex items-center text-gray-600 dark:text-zinc-400 hover:text-pink-600 transition-colors">
                        <i class="fab fa-instagram text-xl w-8"></i>
                        <span class="text-sm font-medium">@akssomer</span>
                    </a>
                    <a href="https://twitter.com/akssomer" target="_blank" class="flex items-center text-gray-600 dark:text-zinc-400 hover:text-sky-500 transition-colors">
                        <i class="fab fa-twitter text-xl w-8"></i>
                        <span class="text-sm font-medium">@akssomer</span>
                    </a>
                </div>
            </div>

            <div class="mt-8">
                <a href="contact.vcf" class="block w-full py-3 bg-gray-100 dark:bg-zinc-800 text-gray-800 dark:text-zinc-200 text-center rounded-xl font-semibold hover:bg-gray-200 dark:hover:bg-zinc-700 transition-colors" id="txt-add-to-contacts">
                </a>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div id="modal" class="modal opacity-0 pointer-events-none fixed w-full h-full top-0 left-0 flex items-center justify-center z-50">
        <div class="modal-overlay absolute w-full h-full bg-black opacity-60"></div>

        <div class="modal-container bg-white dark:bg-zinc-900 w-11/12 md:max-w-2xl mx-auto rounded-3xl shadow-2xl z-50 overflow-y-auto max-h-[90vh] transition-colors duration-300">
            <div class="modal-content py-6 text-left px-6">
                <div class="flex justify-between items-center pb-4 border-b border-gray-100 dark:border-zinc-800">
                    <p id="txt-modal-title" class="text-2xl font-bold text-gray-900 dark:text-white"></p>
                    <div id="close-modal" class="cursor-pointer z-50 p-2 hover:bg-gray-100 dark:hover:bg-zinc-800 rounded-full transition-colors">
                        <i class="fas fa-times text-gray-500 dark:text-zinc-400"></i>
                    </div>
                </div>

                <div class="flex space-x-4 mt-6 mb-4 overflow-x-auto pb-2">
                    <button id="tab-skills" class="tab-btn whitespace-nowrap px-4 py-2 bg-blue-600 text-white rounded-full text-sm font-bold shadow-md"></button>
                    <button id="tab-competitions" class="tab-btn whitespace-nowrap px-4 py-2 bg-gray-100 dark:bg-zinc-800 text-gray-600 dark:text-zinc-400 rounded-full text-sm font-bold hover:bg-gray-200 dark:hover:bg-zinc-700 transition-colors"></button>
                </div>

                <div id="skills-content" class="mt-6 space-y-6">
                    <!-- Dynamic Skills -->
                </div>

                <div id="competitions-content" class="hidden mt-6">
                    <p id="txt-comp-info" class="text-gray-600 dark:text-zinc-400 italic"></p>
                </div>

                <div class="flex justify-end pt-8">
                    <button id="close-modal-footer" class="px-6 py-2 bg-gray-900 dark:bg-white text-white dark:text-black font-bold rounded-xl hover:opacity-90 transition-all" id="txt-modal-close"></button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let translations = {};
        let currentLang = 'tr';

        // Load Translations
        async function loadTranslations() {
            try {
                const response = await fetch('translations.json');
                translations = await response.json();
                applyLanguage(currentLang);
            } catch (error) {
                console.error("Translation load error:", error);
            }
        }

        function applyLanguage(lang) {
            currentLang = lang;
            const t = translations[lang];

            document.title = t.title;
            document.getElementById('txt-occupation').textContent = t.occupation;
            document.getElementById('txt-email').textContent = t.email;
            document.getElementById('txt-website').textContent = t.website;
            document.getElementById('txt-detailed-info').textContent = t.detailed_info;
            document.getElementById('txt-about-title').textContent = t.about_title;
            document.getElementById('txt-about-text').textContent = t.about_text;
            document.getElementById('txt-contact-title').textContent = t.contact_title;
            document.getElementById('txt-add-to-contacts').textContent = t.add_to_contacts;
            document.getElementById('txt-modal-title').textContent = t.detailed_info;
            document.getElementById('tab-skills').textContent = t.modal_skills;
            document.getElementById('tab-competitions').textContent = t.modal_competitions;
            document.getElementById('txt-comp-info').textContent = t.comp_info;
            document.getElementById('close-modal-footer').textContent = t.modal_close;

            // Render Skills
            const skillsDiv = document.getElementById('skills-content');
            skillsDiv.innerHTML = '';
            t.skill_categories.forEach(cat => {
                const div = document.createElement('div');
                div.innerHTML = `
                    <h4 class="font-bold text-lg text-gray-900 dark:text-white mb-2">${cat.title}</h4>
                    <p class="text-gray-600 dark:text-zinc-400 text-sm">${cat.desc}</p>
                `;
                skillsDiv.appendChild(div);
            });

            // Update UI State
            document.getElementById('lang-tr').classList.toggle('lang-active', lang === 'tr');
            document.getElementById('lang-en').classList.toggle('lang-active', lang === 'en');
        }

        // Theme Toggle
        const themeToggle = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const html = document.documentElement;

        themeToggle.addEventListener('click', () => {
            html.classList.toggle('dark');
            const isDark = html.classList.contains('dark');
            themeIcon.className = isDark ? 'fas fa-sun text-zinc-300' : 'fas fa-moon text-gray-700';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });

        // Load Saved Theme
        if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            html.classList.add('dark');
            themeIcon.className = 'fas fa-sun text-zinc-300';
        }

        // Modal Logic
        const openModalBtn = document.getElementById('open-modal');
        const closeModalBtns = [document.getElementById('close-modal'), document.getElementById('close-modal-footer'), document.querySelector('.modal-overlay')];
        const modal = document.getElementById('modal');

        const toggleModal = () => {
            modal.classList.toggle('opacity-0');
            modal.classList.toggle('pointer-events-none');
            document.body.classList.toggle('modal-active');
        };

        openModalBtn.addEventListener('click', toggleModal);
        closeModalBtns.forEach(btn => btn.addEventListener('click', toggleModal));

        // Tab Logic
        const tabSkills = document.getElementById('tab-skills');
        const tabComp = document.getElementById('tab-competitions');
        const skillsContent = document.getElementById('skills-content');
        const compContent = document.getElementById('competitions-content');

        function switchTab(active) {
            if (active === 'skills') {
                tabSkills.classList.replace('bg-gray-100', 'bg-blue-600');
                tabSkills.classList.replace('dark:bg-zinc-800', 'bg-blue-600');
                tabSkills.classList.replace('text-gray-600', 'text-white');
                tabSkills.classList.replace('dark:text-zinc-400', 'text-white');
                tabSkills.classList.add('shadow-md');

                tabComp.classList.replace('bg-blue-600', 'bg-gray-100');
                tabComp.classList.replace('text-white', 'text-gray-600');
                tabComp.classList.add('dark:bg-zinc-800', 'dark:text-zinc-400');
                tabComp.classList.remove('shadow-md');

                skillsContent.classList.remove('hidden');
                compContent.classList.add('hidden');
            } else {
                tabComp.classList.replace('bg-gray-100', 'bg-blue-600');
                tabComp.classList.replace('dark:bg-zinc-800', 'bg-blue-600');
                tabComp.classList.replace('text-gray-600', 'text-white');
                tabComp.classList.replace('dark:text-zinc-400', 'text-white');
                tabComp.classList.add('shadow-md');

                tabSkills.classList.replace('bg-blue-600', 'bg-gray-100');
                tabSkills.classList.replace('text-white', 'text-gray-600');
                tabSkills.classList.add('dark:bg-zinc-800', 'dark:text-zinc-400');
                tabSkills.classList.remove('shadow-md');

                compContent.classList.remove('hidden');
                skillsContent.classList.add('hidden');
            }
        }

        tabSkills.addEventListener('click', () => switchTab('skills'));
        tabComp.addEventListener('click', () => switchTab('comp'));

        // Lang Switchers
        document.getElementById('lang-tr').addEventListener('click', () => applyLanguage('tr'));
        document.getElementById('lang-en').addEventListener('click', () => applyLanguage('en'));

        // Initial Load
        loadTranslations();
    </script>
</body>
</html>
